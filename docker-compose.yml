version: '3.9'

services:
  auth_postgres:
    image: postgres:17
    container_name: auth-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${AUTH_OF_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
      - ./init/init_auth.sql:/docker-entrypoint-initdb.d/init_auth.sql:ro
    networks:
      - app-net

  anal_postgres:
    image: postgres:17
    container_name: anal-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${ANAL_OF_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_anal:/var/lib/postgresql/data
      - ./init/init_auth.sql:/docker-entrypoint-initdb.d/init_auth.sql:ro
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-net

  auth:
    build:
      context: ./authorization_service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: on-failure
    depends_on:
      - auth_postgres
      - redis
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata_auth:
  pgdata_anal: