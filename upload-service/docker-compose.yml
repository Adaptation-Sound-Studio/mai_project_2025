version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: upload_postgres
    restart: always
    environment:
      POSTGRES_USER: upload_user
      POSTGRES_PASSWORD: upload_pass
      POSTGRES_DB: upload_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: upload_redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: upload_app
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis
    environment:
      UPL_DB_HOST: postgres
      UPL_DB_PORT: 5432
      DB_USER: upload_user
      DB_PASSWORD: upload_pass
      UPL_OF_DB_NAME: upload_db
      REDIS_ADDR: redis:6379
      SERVER_PORT: 8081

volumes:
  pgdata:



