version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: auth-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-net

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    restart: on-failure
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata: